    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"informativos":[{"id":9,"creado_por_id":1,"modificado_por_id":1,"titulo":"Actualizaci\u00f3n SRI: Nuevos Porcentajes de Retenci\u00f3n 2026","resolucion_oficial":"NAC-00000009","descripcion_portada":"An\u00e1lisis t\u00e9cnico sobre la Resoluci\u00f3n NAC-00000009 que redefine el cumplimiento tributario para el presente ejercicio fiscal y su impacto directo en la caja corporativa.","contenido":"<p>A partir de las recientes disposiciones del Gobierno Central, el Servicio de Rentas Internas (SRI) ha emitido la Resoluci\u00f3n NAC-00000009. Este documento normativo establece las nuevas directrices obligatorias para los agentes de retenci\u00f3n a nivel nacional.<\/p><h2><strong>Impacto en la Operaci\u00f3n Corporativa<\/strong><\/h2><p><\/p><p>A partir del <strong>1 de marzo de 2026<\/strong>, entra en vigencia la actualizaci\u00f3n obligatoria de retenciones en la fuente para el Impuesto a la Renta. Este cambio estructural afecta principalmente a todas las transacciones comerciales que no se encuentren especificadas bajo ninguna regla especial, modificando el esquema de flujo de caja para proveedores y contratistas. <\/p><p><\/p><table style=\"min-width: 100px;\"><colgroup><col style=\"min-width: 25px;\"><col style=\"min-width: 25px;\"><col style=\"min-width: 25px;\"><col style=\"min-width: 25px;\"><\/colgroup><tbody><tr><th colspan=\"1\" rowspan=\"1\"><p>NOMBRE<\/p><\/th><th colspan=\"1\" rowspan=\"1\"><p>VALOR<\/p><\/th><th colspan=\"1\" rowspan=\"1\"><p>PORCENTAJE<\/p><\/th><th colspan=\"1\" rowspan=\"1\"><p>TOTAL<\/p><\/th><\/tr><tr><td colspan=\"1\" rowspan=\"1\"><p>wsdad<\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p>30<\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p>3%<\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p>1000000<\/p><\/td><\/tr><tr><td colspan=\"1\" rowspan=\"1\"><p>sddada<\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p>40<\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p>2%<\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p>-100000000<\/p><\/td><\/tr><tr><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><\/tr><tr><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><\/tr><tr><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><\/tr><tr><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><td colspan=\"1\" rowspan=\"1\"><p><\/p><\/td><\/tr><\/tbody><\/table><h2><strong>Acciones Recomendadas Inmediatas<\/strong><\/h2><p><\/p><p>Es imperativo que los departamentos financieros y contables parametricen sus sistemas ERP (Enterprise Resource Planning) para reflejar estos nuevos porcentajes antes de la fecha l\u00edmite. Emitir comprobantes de retenci\u00f3n con tasas desactualizadas podr\u00eda generar multas, intereses y la invalidaci\u00f3n de la deducibilidad del gasto ante futuras auditor\u00edas de control del SRI.<\/p><p><strong>Para una transici\u00f3n sin riesgos, el equipo de Consultor\u00eda Tributaria de MHorizon ha desarrollado una matriz de validaci\u00f3n de ERPs que asegura el cumplimiento normativo total de su organizaci\u00f3n en menos de 48 horas.<\/strong><\/p>","imagen_portada_url":"informativos\/portadas\/VK6lkuBCEuu7jOL5IZ92BLTCK1i76aWvrao2JJQ4.jpg","pdf_url":"informativos\/documentos\/KWFoIYy0pOFOZdugd19Acylw0WbkxWPmt4UP8AdM.pdf","created_at":"2026-04-10T23:29:22.000000Z","updated_at":"2026-04-10T23:48:07.000000Z","creador":{"id":1,"nombre":"Usuario","apellido":"Admin"},"modificador":{"id":1,"nombre":"Usuario","apellido":"Admin"}},{"id":3,"creado_por_id":1,"modificado_por_id":null,"titulo":"TRANSICI\u00d3N A NIIF Y CIERRE FISCAL ESTRAT\u00c9GICO","resolucion_oficial":"APLICACI\u00d3N NIIF","descripcion_portada":"Claves esenciales para alinear la normativa contable internacional con las exigencias tributarias locales.","contenido":"asdsad","imagen_portada_url":"informativos\/portadas\/c7rq72M2AUwC9WgfqSfe8B4wIRHRvxZnHEFAzI2A.png","pdf_url":"informativos\/documentos\/bqMEDjnWBxanbKBQCnYhRDCRuk00ktVNM6OxIh4l.pdf","created_at":"2026-04-10T02:39:19.000000Z","updated_at":"2026-04-10T02:39:19.000000Z","creador":{"id":1,"nombre":"Usuario","apellido":"Admin"},"modificador":null},{"id":2,"creado_por_id":1,"modificado_por_id":null,"titulo":"REPORTE DE BENEFICIARIOS FINALES A LA SCVS","resolucion_oficial":"SCVS RESOLUCI\u00d3N","descripcion_portada":"Gu\u00eda t\u00e9cnica sobre la correcta identificaci\u00f3n y declaraci\u00f3n de beneficiarios efectivos para evitar multas societarias.","contenido":"asasdjsakdsakdsajkdjsa","imagen_portada_url":"informativos\/portadas\/brOfVemLOovVBOXWW8IlGq3mLud87zLCGCysGWeP.png","pdf_url":"informativos\/documentos\/YGqEQzrAaRJPCgUH0FiLP9EaIj9BXcBk0yXemZat.pdf","created_at":"2026-04-10T02:38:45.000000Z","updated_at":"2026-04-10T02:38:45.000000Z","creador":{"id":1,"nombre":"Usuario","apellido":"Admin"},"modificador":null}],"status":200}'
